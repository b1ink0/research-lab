name: wp-image-fallbacks

x-env: &env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_USER: root
  WORDPRESS_DB_PASSWORD: root
  WORDPRESS_DB_NAME: wp

x-volumes: &volumes
  - wproot:/var/www/html
  - ./wordpress/mu-plugins:/var/www/html/wp-content/mu-plugins:ro
  - ./wordpress:/wordpress:ro
  - ./images:/images:ro

services:
  db:
    image: mariadb:lts@sha256:4aaf88b3106382c8c18e49f0cec60267be618fc22f858c4503afb2a2555afed3
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wp
  wp:
    image: wordpress:php8.3-apache@sha256:1f59452d2ceed177ad383d17b3a6a7a5c8225d89e34adb36880af8603ac244c2
    depends_on: [db]
    ports: ["8899:80"]
    environment: *env
    volumes: *volumes
  cli:
    image: wordpress:cli-php8.3@sha256:14ad78160eba4c1ee30b33f9edeb44341c0de28a051fc472ee60136c775f0f0f
    user: "33:33"
    depends_on: [wp]
    environment:
      <<: *env
      HOME: /tmp
    volumes: *volumes
    entrypoint: ["sleep", "infinity"]

volumes:
  wproot:
